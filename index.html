<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>おしのR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- フォント -->
  <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&family=Shippori+Mincho&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Sawarabi Gothic", sans-serif;
      background-color: #e6f7ff;
      color: #333;
      text-align: center;
    }

    h1 {
      font-size: 2.4rem;
      margin-top: 20px;
      font-family: "Sawarabi Gothic";
      color: #01579b;
    }

    h1 span {
      font-family: "Shippori Mincho";
      font-size: 2.6rem;
      color: #004d40;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 0.9rem;
      color: #455a64;
    }

    .container {
      width: 92%;
      max-width: 800px;
      margin: 20px auto;
      text-align: left;
    }

    label {
      font-weight: bold;
      color: #00796b;
    }

    textarea {
      width: 100%;
      height: 180px;
      border-radius: 10px;
      border: 1px solid #81c784;
      padding: 10px;
      font-family: "JetBrains Mono", monospace;
      background: #f1f8e9;
      color: #1b5e20;
      resize: vertical;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(to right, #26a69a, #42a5f5);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    #output {
      margin-top: 20px;
      padding: 12px;
      min-height: 120px;
      background: #e3f2fd;
      border-radius: 10px;
      font-family: "JetBrains Mono", monospace;
      white-space: pre-wrap;
      color: #0d47a1;
    }

    #plot-canvas {
      margin-top: 20px;
      background: white;
      border: 1px solid #b3e5fc;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>おしの<span>R</span></h1>
  <div class="subtitle">Rであそぶ・まなぶ・ためす、小さな実験室。</div>

  <div class="container">
    <label>Rコード入力</label>
    <textarea id="code-input">
# 例：
# plot(1:10)

plot(1:10)
    </textarea>

    <button id="run-btn">Rコードを実行</button>

    <h3>結果</h3>
    <div id="output">ここに結果が表示されます</div>

    <h3>おしのR グラフ</h3>
    <canvas id="plot-canvas" width="600" height="400"></canvas>
  </div>

  <!-- WebR -->
  <script type="module">
    import { WebR } from "https://webr.r-wasm.org/latest/webr.mjs";

    const runBtn = document.getElementById("run-btn");
    const codeInput = document.getElementById("code-input");
    const outputEl = document.getElementById("output");

    const webr = new WebR();

    async function initWebR() {
      outputEl.textContent = "WebR を起動しています…";
      await webr.init();

      // グラフ描画先を canvas に設定
      await webr.setGraphicsDevice("#plot-canvas");

      outputEl.textContent = "WebR 準備OK！";
    }

    initWebR();

    runBtn.addEventListener("click", async () => {
      const code = codeInput.value;

      outputEl.textContent = "実行中…";

      try {
        const result = await webr.evalR(code);
        const js = await result.toJs();

        outputEl.textContent = String(js);
      } catch (err) {
        outputEl.textContent = "エラー:\n" + err;
      }
    });
  </script>

</body>
</html>
