<script type="module">
  import { WebR } from "https://webr.r-wasm.org/latest/webr.mjs";

  const webR = new WebR();
  const resultArea = document.getElementById("result");
  const runBtn = document.getElementById("runBtn");
  const canvas = document.getElementById("webr-canvas");
  const ctx = canvas.getContext("2d");

  async function initWebR() {
    try {
      resultArea.textContent = "WebR を初期化しています…";
      await webR.init();
      resultArea.textContent = "ここに結果が表示されます";
      runBtn.disabled = false;
    } catch (e) {
      resultArea.textContent = "WebR の初期化に失敗しました。\n詳細: " + e;
      runBtn.disabled = true;
    }
  }

  initWebR();

  runBtn.addEventListener("click", async () => {
    const code = document.getElementById("rcode").value.trim();
    if (!code) {
      resultArea.textContent = "Rコードが入力されていません。";
      return;
    }

    resultArea.textContent = "実行中です…";

    const hasPlot = /\b(plot|hist|barplot|ggplot)\s*\(/.test(code);

    const wrappedCode = hasPlot
      ? `
png("plot.png", width=1008, height=1008)
try({ ${code} })
dev.off()
`
      : code;

    try {
      const rResult = await webR.evalR(wrappedCode);

      let jsResult = null;
      try {
        jsResult = await rResult.toJs();
      } catch (e) {}

      let drewPlot = false;
      if (hasPlot) {
        try {
          const fileData = await webR.FS.readFile("plot.png");
          const blob = new Blob([fileData], { type: "image/png" });
          const bitmap = await createImageBitmap(blob);

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(bitmap, 0, 0);
          drewPlot = true;
        } catch (e) {
          console.warn("プロット画像の読み込みに失敗しました:", e);
        }
      }

      if (drewPlot) {
        resultArea.textContent = "（グラフを描画しました）";
      } else if (jsResult === null || jsResult === undefined) {
        resultArea.textContent = "（出力なし）";
      } else if (Array.isArray(jsResult.values)) {
        resultArea.textContent = jsResult.values.join(", ");
      } else {
        resultArea.textContent = String(jsResult);
      }

    } catch (err) {
      resultArea.textContent = "Rコードの実行中にエラーが発生しました:\n" + err;
    }
  });
</script>
