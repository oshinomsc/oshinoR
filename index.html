<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>おしのR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 手書き風（R用）＆丸ゴシック（おしの用）の例 -->
  <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&family=Shippori+Mincho&display=swap" rel="stylesheet" />

  <style>
    /* 全体レイアウト -------------------------------------------------------- */
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Sawarabi Gothic", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #e6f7ff; /* うすい水色ベース */
      color: #333;
    }

    .app-wrapper {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 12px;
    }

    .app-card {
      width: 100%;
      max-width: 960px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      padding: 24px 20px 28px;
      position: relative;
      overflow: hidden;
    }

    /* チェック柄の背景（カード内に薄く） ------------------------------------- */
    .app-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(178, 235, 242, 0.28) 1px, transparent 1px),
        linear-gradient(180deg, rgba(178, 235, 242, 0.28) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.7;
      pointer-events: none;
    }

    /* レース風フレーム ------------------------------------------------------ */
    .lace-frame {
      position: absolute;
      inset: 10px;
      border-radius: 18px;
      border: 4px dashed rgba(179, 229, 252, 0.9);
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    /* ヘッダー -------------------------------------------------------------- */
    .header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 20px;
    }

    .title-line {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 999px;
      background: linear-gradient(to right, #b3e5fc, #b2f2e6);
      box-shadow: 0 4px 10px rgba(0, 150, 136, 0.25);
    }

    .title-oshino {
      font-family: "Sawarabi Gothic", system-ui, sans-serif;
      font-size: 2.2rem;
      letter-spacing: 0.18em;
      color: #01579b;
    }

    .title-r {
      font-family: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 2.6rem;
      color: #004d40;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 0.95rem;
      color: #455a64;
    }

    /* メインエリア ---------------------------------------------------------- */
    .main-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 16px;
      margin-top: 8px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* コードエリア ---------------------------------------------------------- */
    .panel {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      border: 2px solid rgba(179, 229, 252, 0.9);
      padding: 14px 12px 12px;
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #00796b;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .panel-title-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      border-radius: 999px;
      background-color: #b2f2e6;
      color: #004d40;
      font-size: 0.75rem;
    }

    /* 緑背景の入力欄 -------------------------------------------------------- */
    #code-input {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid #81c784;
      padding: 10px 10px 10px 12px;
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
      font-size: 0.9rem;
      background: linear-gradient(
        135deg,
        #e8f5e9 0%,
        #f1f8e9 35%,
        #e0f7fa 100%
      );
      color: #1b5e20;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(129, 199, 132, 0.4);
    }

    #code-input:focus {
      box-shadow:
        inset 0 0 0 1px rgba(56, 142, 60, 0.8),
        0 0 0 3px rgba(165, 214, 167, 0.7);
    }

    /* 実行ボタン ------------------------------------------------------------ */
    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .run-button {
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(to right, #26a69a, #42a5f5);
      color: #fff;
      box-shadow: 0 3px 8px rgba(0, 150, 136, 0.45);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, filter 0.08s ease-out;
    }

    .run-button:hover {
      filter: brightness(1.05);
      box-shadow: 0 5px 12px rgba(0, 150, 136, 0.55);
      transform: translateY(-1px);
    }

    .run-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 5px rgba(0, 150, 136, 0.4);
    }

    .run-button[disabled] {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    .run-icon {
      font-size: 1rem;
    }

    .status-text {
      font-size: 0.8rem;
      color: #607d8b;
      margin-right: auto;
    }

    /* 出力エリア ------------------------------------------------------------ */
    #output {
      width: 100%;
      min-height: 220px;
      border-radius: 10px;
      border: 1px solid #b3e5fc;
      padding: 10px 12px;
      background-color: rgba(236, 248, 255, 0.9);
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
      font-size: 0.9rem;
      color: #0d47a1;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    /* フッター -------------------------------------------------------------- */
    .footer-note {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      text-align: right;
      font-size: 0.75rem;
      color: #78909c;
    }
  </style>
</head>

<body>
  <div class="app-wrapper">
    <div class="app-card">
      <div class="lace-frame"></div>

      <header class="header">
        <div class="title-line">
          <div class="title-oshino">おしの</div>
          <div class="title-r">R</div>
        </div>
        <div class="subtitle">
          Rであそぶ・まなぶ・ためす、小さな実験室。
        </div>
      </header>

      <main class="main-grid">
        <!-- 左：コード入力 -------------------------------------------------- -->
        <section class="panel">
          <div class="panel-title">
            <span class="panel-title-badge">入力</span>
            Rコードを書いてみよう
          </div>
          <textarea id="code-input" spellcheck="false">
# ここにRコードを書いて、「実行」ボタンを押してね
x <- 1:10
mean(x)
          </textarea>
          <div class="controls">
            <div id="status" class="status-text">WebR の準備中...</div>
            <button id="run-btn" class="run-button" disabled>
              <span class="run-icon">▶</span>
              実行
            </button>
          </div>
        </section>

        <!-- 右：出力 -------------------------------------------------------- -->
        <section class="panel">
          <div class="panel-title">
            <span class="panel-title-badge">出力</span>
            結果をここに表示するよ
          </div>
          <div id="output">
WebR の起動を待っています…
          </div>
        </section>
      </main>

      <div class="footer-note">
        おしのR / powered by WebR
      </div>
    </div>
  </div>

  <!-- WebR 読み込み＆実行ロジック -------------------------------------------- -->
  <script type="module">
    import { WebR } from "https://webr.r-wasm.org/latest/webr.mjs";

    const statusEl = document.getElementById("status");
    const runBtn = document.getElementById("run-btn");
    const codeInput = document.getElementById("code-input");
    const outputEl = document.getElementById("output");

    // WebR の初期化
    const webr = new WebR();

    async function initWebR() {
      try {
        statusEl.textContent = "WebR を起動しています…";
        await webr.init();
        statusEl.textContent = "WebR 準備OK！ Rコードを実行できます。";
        runBtn.disabled = false;
      } catch (e) {
        console.error(e);
        statusEl.textContent = "WebR の起動に失敗しました。";
        outputEl.textContent = "エラー: WebR を初期化できませんでした。";
      }
    }

    initWebR();

    // 実行ボタンの処理
    runBtn.addEventListener("click", async () => {
      const code = codeInput.value;

      if (!code.trim()) {
        outputEl.textContent = "Rコードが空です。何か書いてから実行してね。";
        return;
      }

      runBtn.disabled = true;
      statusEl.textContent = "実行中…";

      try {
        // 出力をキャプチャするために sink() を使う
        const wrappedCode = `
          zz <- textConnection("out", "w")
          sink(zz)
          sink(zz, type = "message")
          ${code}
          sink()
          sink(type = "message")
          close(zz)
          paste(out, collapse = "\\n")
        `;

        const result = await webr.evalR(wrappedCode);
        const jsResult = await result.toJs();

        outputEl.textContent = String(jsResult);
        statusEl.textContent = "実行完了！";
      } catch (err) {
        console.error(err);
        outputEl.textContent = "エラーが発生しました:\n" + err;
        statusEl.textContent = "エラー";
      } finally {
        runBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
